    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 585px;
            max-width: 100%;
            background: #000;
            border-radius: 12px;
            padding: 58px 67px 56px;
            text-align: center;
            color: #fff;
        }

        /* Logo */
        .logo {
            width: 106px;
            height: 106px;
            border: 2px solid #fff;
            border-radius: 50%;
            margin: 0 auto 23px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Title */
        .title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        /* Telegram Button */
        .telegram-btn {
            width: 100%;
            height: 62px;
            border: none;
            border-radius: 40px;
            background: #0c9eaf;
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 6px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            transition: 0.25s ease;
        }

        .telegram-btn:hover {
            background: #12b3c5;
            transform: scale(1.02);
        }

        /* Experience */
        .experience {
            color: #20ff00;
            font-size: 28px;
            font-weight: 700;
            margin: 18px 0 24px;
        }

        /* Points */
        .points {
            display: flex;
            flex-direction: column;
            gap: 18px;
            text-align: center;
            font-size: 18px;
            line-height: 1.35;
        }

        .point {
            display: block;
        }

        .point span {
            display: inline;
        }

        /* Bottom Heading */
        .bottom-title {
            font-size: 28px;
            font-weight: 700;
            margin: 27px 0 19px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 40px 25px 38px;
                border-radius: 10px;
            }

            .logo {
                width: 90px;
                height: 90px;
                margin-bottom: 20px;
            }

            .title {
                font-size: 30px;
                margin-bottom: 20px;
            }

            .telegram-btn {
                height: 56px;
                font-size: 19px;
                letter-spacing: 4px;
            }

            .experience {
                font-size: 23px;
                margin: 17px 0 22px;
            }

            .points {
                font-size: 16px;
                gap: 16px;
            }

            .bottom-title {
                font-size: 23px;
                margin-top: 25px;
            }
        }

        @media (max-width: 380px) {

            .card {
                padding: 32px 18px;
            }

            .logo {
                width: 80px;
                height: 80px;
            }

            .title {
                font-size: 27px;
            }

            .telegram-btn {
                height: 52px;
                font-size: 16px;
                letter-spacing: 3px;
            }

            .experience {
                font-size: 20px;
            }

            .points {
                font-size: 14px;
            }

            .bottom-title {
                font-size: 20px;
            }
        }
    </style>
</head>
